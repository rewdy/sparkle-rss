name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sparkle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - name: unit + integration tests
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sparkle_test

      - run: pnpm build

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.15'
          terraform_wrapper: false

      - name: terraform fmt + validate
        run: |
          terraform fmt -check -recursive tf
          terraform -chdir=tf init -backend=false
          terraform -chdir=tf validate

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-zips
          path: dist/*.zip
          retention-days: 7

  # Renders a real `terraform plan` on every PR so the change set is visible
  # before merge. Uses a read-only OIDC role (trusts pull_request refs) so it
  # can refresh against live state but change nothing. Tolerant during the
  # bootstrap PR: before the plan role has been applied once, it logs and skips
  # instead of failing.
  plan:
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: plan-${{ github.head_ref }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
    env:
      TF_DIR: tf
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.15'
          terraform_wrapper: false

      - name: configure aws credentials (OIDC, read-only)
        id: creds
        # Bootstrap: before this PR's plan role is provisioned, TF_PLAN_ROLE_ARN is
        # unset and the step is skipped. Once set, assume must succeed or we fail loudly.
        if: ${{ vars.TF_PLAN_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init (remote state)
        env:
          TF_PLAN_ROLE_ARN: ${{ vars.TF_PLAN_ROLE_ARN }}
        run: |
          if [ -z "$TF_PLAN_ROLE_ARN" ]; then
            echo "::notice::TF_PLAN_ROLE_ARN not set yet (this PR bootstraps the plan role). Skipping plan."
            exit 0
          fi
          terraform -chdir=$TF_DIR init

      - name: terraform plan
        env:
          TF_PLAN_ROLE_ARN: ${{ vars.TF_PLAN_ROLE_ARN }}
        run: |
          if [ -z "$TF_PLAN_ROLE_ARN" ]; then
            echo "::notice::Plan skipped: TF_PLAN_ROLE_ARN not provisioned yet."
            exit 0
          fi
          terraform -chdir=$TF_DIR plan -input=false -out=tfplan 2>&1 | tee tfplan.log
          # Publish the human-readable diff to the job summary for easy review.
          {
            echo "## Terraform plan"
            echo '```diff'
            cat tfplan.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
