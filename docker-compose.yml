services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      FLOCI_STORAGE_MODE: persistent
    volumes:
      - ./.floci-data:/app/data

  media-init:
    image: amazon/aws-cli:2
    depends_on:
      floci:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until aws s3api head-bucket --bucket sparkle-rss-media-local
        --endpoint-url http://floci:4566 >/dev/null 2>&1; do
          aws s3api create-bucket --bucket sparkle-rss-media-local
          --endpoint-url http://floci:4566 >/dev/null 2>&1 || true;
          sleep 1;
        done

  db-migrate:
    build:
      context: .
      dockerfile: docker/local/db-migrate.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/sparkle_dev
    command: ["pnpm", "--filter", "@sparkle/db", "migrate:local"]
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sparkle_dev
    ports:
      - "5432:5432"
    volumes:
      - sparkle_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sparkle_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sparkle_pgdata:
