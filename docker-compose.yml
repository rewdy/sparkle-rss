services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sparkle_dev
    ports:
      - "5432:5432"
    volumes:
      - sparkle_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sparkle_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sparkle_pgdata:
